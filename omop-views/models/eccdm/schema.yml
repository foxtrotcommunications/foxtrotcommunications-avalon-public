version: 2

models:
  # ═══════════════════════════════════════════════════════════
  # ECCDM — European Cancer Common Data Model Tables
  # HL7 EU Cancer Common IG: https://build.fhir.org/ig/hl7-eu/cancer-common/
  #
  # These tables sit on top of the OMOP CDM tables and filter/reshape
  # them into the 6 ECCDM conceptual entities for cancer analytics.
  # Cancer identification uses OMOP concept_ancestor hierarchy
  # (descendants of concept 443392 — Malignant neoplastic disease).
  # ═══════════════════════════════════════════════════════════

  - name: eccdm_cancer_patient
    description: "ECCDM CancerPatient — patients with at least one condition descending from OMOP concept 443392 (Malignant neoplastic disease)."
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('omop_person')
              field: person_id

  - name: eccdm_cancer_condition
    description: "ECCDM CancerConditionAtDiagnosis — cancer diagnoses identified via OMOP concept_ancestor hierarchy from SNOMED-coded conditions."
    columns:
      - name: condition_occurrence_id
        tests:
          - unique
          - not_null
      - name: person_id
        tests:
          - not_null
          - relationships:
              to: ref('eccdm_cancer_patient')
              field: person_id
      - name: diagnosis_date
        tests:
          - not_null
      - name: condition_source_value
        tests:
          - not_null

  - name: eccdm_cancer_stage
    description: "ECCDM CancerStage — measurements for cancer patients including TNM staging (if available) and lab values."
    columns:
      - name: measurement_id
        tests:
          - not_null
      - name: person_id
        tests:
          - not_null

  - name: eccdm_cancer_treatment
    description: "ECCDM CancerTreatment — surgery, radiotherapy, and systemic treatments for cancer patients using OMOP concept hierarchy."
    columns:
      - name: treatment_id
        tests:
          - not_null
      - name: person_id
        tests:
          - not_null
          - relationships:
              to: ref('eccdm_cancer_patient')
              field: person_id
      - name: treatment_category
        description: "surgery, radiotherapy, or systemic"
        tests:
          - accepted_values:
              values: ['surgery', 'radiotherapy', 'systemic']

  - name: eccdm_treatment_response
    description: "ECCDM OverallCancerTreatmentResponse — lab measurements for cancer patients that can indicate treatment response trends."
    columns:
      - name: measurement_id
        tests:
          - not_null
      - name: person_id
        tests:
          - not_null
          - relationships:
              to: ref('eccdm_cancer_patient')
              field: person_id

  - name: eccdm_follow_up
    description: "ECCDM LastFollowUp — most recent visit per cancer patient with vital status, days since diagnosis, and days since last treatment."
    columns:
      - name: person_id
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('eccdm_cancer_patient')
              field: person_id
      - name: vital_status
        tests:
          - accepted_values:
              values: ['alive', 'deceased']
      - name: follow_up_date
        tests:
          - not_null
