        identifier: "{{ var('forge_tables')['claim']['item_product_coding'] }}"

  - name: forge_eob
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_eob_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: eob_raw
