      - name: condition_raw
        identifier: "{{ var('forge_tables')['condition']['raw'] }}"
      - name: condition_code
        identifier: "{{ var('forge_tables')['condition']['code'] }}"
      - name: condition_code_coding
        identifier: "{{ var('forge_tables')['condition']['code_coding'] }}"
      - name: condition_subject
        identifier: "{{ var('forge_tables')['condition']['subject'] }}"
      - name: condition_encounter
        identifier: "{{ var('forge_tables')['condition']['encounter'] }}"

  - name: forge_procedure
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_procedure_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: procedure_raw
        identifier: "{{ var('forge_tables')['procedure']['raw'] }}"
      - name: procedure_code
        identifier: "{{ var('forge_tables')['procedure']['code'] }}"
      - name: procedure_code_coding
        identifier: "{{ var('forge_tables')['procedure']['code_coding'] }}"
      - name: procedure_performed
        identifier: "{{ var('forge_tables')['procedure']['performed'] }}"
      - name: procedure_subject
        identifier: "{{ var('forge_tables')['procedure']['subject'] }}"
      - name: procedure_encounter
        identifier: "{{ var('forge_tables')['procedure']['encounter'] }}"

  - name: forge_observation
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_observation_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: observation_raw
        identifier: "{{ var('forge_tables')['observation']['raw'] }}"
      - name: observation_code
        identifier: "{{ var('forge_tables')['observation']['code'] }}"
      - name: observation_code_coding
        identifier: "{{ var('forge_tables')['observation']['code_coding'] }}"
      - name: observation_value
        identifier: "{{ var('forge_tables')['observation']['value'] }}"
      - name: observation_subject
        identifier: "{{ var('forge_tables')['observation']['subject'] }}"
      - name: observation_encounter
        identifier: "{{ var('forge_tables')['observation']['encounter'] }}"

  - name: forge_medication_request
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_medication_request_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: med_request_raw
        identifier: "{{ var('forge_tables')['medication_request']['raw'] }}"
      - name: med_request_med_concept
        identifier: "{{ var('forge_tables')['medication_request']['med_concept'] }}"
      - name: med_request_med_coding
        identifier: "{{ var('forge_tables')['medication_request']['med_coding'] }}"
      - name: med_request_subject
        identifier: "{{ var('forge_tables')['medication_request']['subject'] }}"
