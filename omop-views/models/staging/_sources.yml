        identifier: "{{ var('forge_tables')['medication_request']['encounter'] }}"

  - name: forge_claim
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_claim_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: claim_raw
        identifier: "{{ var('forge_tables')['claim']['raw'] }}"
      - name: claim_billable_period
