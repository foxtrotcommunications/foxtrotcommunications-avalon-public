version: 2

sources:
  # ═══════════════════════════════════════════════════════════════
  # FORGE-CORE NORMALIZED SUB-TABLES
  #
  # Table names use forge-core's 4-char truncation + rank convention.
  # These defaults match standard FHIR R4 (Synthea). For custom
  # profiles, regenerate with: python discover_table_map.py
  # and override the forge_tables var in your dbt_project.yml.
  #
  # The identifier column in each table (table_path) contains the
  # canonical FHIR path, which is always deterministic regardless
  # of the truncated table name.
  # ═══════════════════════════════════════════════════════════════

  - name: forge_patient
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_patient_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: patient_raw
        identifier: "{{ var('forge_tables')['patient']['raw'] }}"
      - name: patient_extension
        identifier: "{{ var('forge_tables')['patient']['extension'] }}"
      - name: patient_ext_ext
        identifier: "{{ var('forge_tables')['patient']['ext_ext'] }}"
      - name: patient_ext_ext_val
        identifier: "{{ var('forge_tables')['patient']['ext_ext_val'] }}"

  - name: forge_encounter
    database: "{{ var('forge_project') }}"
    schema: "{{ var('forge_encounter_dataset') }}"
    tables:
      - name: frg__root
        identifier: frg__root
      - name: encounter_raw
        identifier: "{{ var('forge_tables')['encounter']['raw'] }}"
      - name: encounter_class
        identifier: "{{ var('forge_tables')['encounter']['class'] }}"
      - name: encounter_period
        identifier: "{{ var('forge_tables')['encounter']['period'] }}"
      - name: encounter_participant
        identifier: "{{ var('forge_tables')['encounter']['participant'] }}"
      - name: encounter_part_indiv
        identifier: "{{ var('forge_tables')['encounter']['part_indiv'] }}"
      - name: encounter_subject
        identifier: "{{ var('forge_tables')['encounter']['subject'] }}"

  - name: forge_condition
    database: "{{ var('forge_project') }}"
