      - name: eob_patient
        identifier: "{{ var('forge_tables')['eob']['patient'] }}"
      - name: eob_insurer
        identifier: "{{ var('forge_tables')['eob']['insurer'] }}"
      - name: eob_total
        identifier: "{{ var('forge_tables')['eob']['total'] }}"
      - name: eob_total_amount
