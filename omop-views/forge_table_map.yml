# Default forge table map for standard FHIR R4 (Synthea)
#
# Maps semantic FHIR paths → actual forge-core table names.
# Generated by discover_table_map.py or maintained manually.
#
# To regenerate from a live dataset:
#   python discover_table_map.py --project your-project
#
# Override in your dbt_project.yml:
#   vars:
#     forge_tables:
#       patient:
#         raw: "root__raw_1"
#         extension: "root__raw_1__my_custom_name"

forge_tables:
  patient:
    raw:           "root__raw_1"
    extension:     "root__raw_1__exte1"
    ext_ext:       "root__raw_1__exte1__exte1"
    ext_ext_val:   "root__raw_1__exte1__exte1__valu1"
    address:       "root__raw_1__addr1"
  encounter:
    raw:           "root__raw_1"
    class:         "root__raw_1__clas1"
    period:        "root__raw_1__peri1"
    participant:   "root__raw_1__part1"
    part_indiv:    "root__raw_1__part1__indi1"
    subject:       "root__raw_1__subj1"
  condition:
    raw:           "root__raw_1"
    code:          "root__raw_1__code1"
    code_coding:   "root__raw_1__code1__codi1"
    subject:       "root__raw_1__subj1"
    encounter:     "root__raw_1__enco1"
  procedure:
    raw:           "root__raw_1"
    code:          "root__raw_1__code1"
    code_coding:   "root__raw_1__code1__codi1"
    performed:     "root__raw_1__perf1"
    subject:       "root__raw_1__subj1"
    encounter:     "root__raw_1__enco1"
  observation:
    raw:           "root__raw_1"
    code:          "root__raw_1__code1"
    code_coding:   "root__raw_1__code1__codi1"
    value_quantity:  "root__raw_1__valu2"
    value_cc_coding: "root__raw_1__valu1__codi1"
    subject:       "root__raw_1__subj1"
    encounter:     "root__raw_1__enco1"
  medication_request:
    raw:           "root__raw_1"
    med_concept:   "root__raw_1__medi1"
    med_coding:    "root__raw_1__medi1__codi1"
    subject:       "root__raw_1__subj1"
    encounter:     "root__raw_1__enco1"
