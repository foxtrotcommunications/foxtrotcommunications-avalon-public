name: 'avalon_omop'
version: '1.0.0'
config-version: 2

profile: 'forge'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Override these in your profiles.yml or dbt_project.yml
  forge_project: "{{ env_var('FORGE_PROJECT', 'foxtrot-communications-public') }}"
  # Per-resource normalized datasets produced by forge-core
  forge_patient_dataset: "fhir_normalized_patient"
  forge_encounter_dataset: "fhir_normalized_encounter"
  forge_condition_dataset: "fhir_normalized_condition"
  forge_procedure_dataset: "fhir_normalized_procedure"
  forge_observation_dataset: "fhir_normalized_observation"
  forge_medication_request_dataset: "fhir_normalized_medicationrequest"
  forge_immunization_dataset: "fhir_normalized_immunization"
  forge_claim_dataset: "fhir_normalized_claim"
  forge_eob_dataset: "fhir_normalized_explanationofbenefit"

  # Forge sub-table name map — default for standard FHIR R4 (Synthea).
  # Names are generated by forge-core's 4-char truncation + rank algorithm.
  # Regenerate for your deployment: python discover_table_map.py --project YOUR_PROJECT
  # Or override individual entries in your dbt_project.yml vars.
  forge_tables:
    patient:
      raw:         "frg__root__raw_1"
      extension:   "frg__root__raw_1__exte1"
      ext_ext:     "frg__root__raw_1__exte1__exte1"
      ext_ext_val: "frg__root__raw_1__exte1__exte1__valu1"
    encounter:
      raw:         "frg__root__raw_1"
      class:       "frg__root__raw_1__clas1"
      period:      "frg__root__raw_1__peri1"
      participant: "frg__root__raw_1__part1"
      part_indiv:  "frg__root__raw_1__part1__indi1"
      subject:     "frg__root__raw_1__subj1"
    condition:
      raw:         "frg__root__raw_1"
      code:        "frg__root__raw_1__code1"
      code_coding: "frg__root__raw_1__code1__codi1"
      subject:     "frg__root__raw_1__subj1"
      encounter:   "frg__root__raw_1__enco1"
    procedure:
      raw:         "frg__root__raw_1"
      code:        "frg__root__raw_1__code1"
      code_coding: "frg__root__raw_1__code1__codi1"
      performed:   "frg__root__raw_1__perf1"
      subject:     "frg__root__raw_1__subj1"
      encounter:   "frg__root__raw_1__enco1"
    observation:
      raw:         "frg__root__raw_1"
      code:        "frg__root__raw_1__code1"
      code_coding: "frg__root__raw_1__code1__codi1"
      value:       "frg__root__raw_1__valu1"
      subject:     "frg__root__raw_1__subj1"
      encounter:   "frg__root__raw_1__enco1"
    medication_request:
      raw:         "frg__root__raw_1"
      med_concept: "frg__root__raw_1__medi1"
      med_coding:  "frg__root__raw_1__medi1__codi1"
      subject:     "frg__root__raw_1__subj1"
      encounter:   "frg__root__raw_1__enco1"
    claim:
      raw:              "frg__root__raw_1"
      billable_period:  "frg__root__raw_1__bill1"
      provider:         "frg__root__raw_1__prov1"
      patient:          "frg__root__raw_1__pati1"
      facility:         "frg__root__raw_1__faci1"
      priority:         "frg__root__raw_1__prio1"
      priority_coding:  "frg__root__raw_1__prio1__codi1"
      item:             "frg__root__raw_1__item1"
      item_encounter:   "frg__root__raw_1__item1__enco1"
      item_net:         "frg__root__raw_1__item1__net_1"
      item_product_coding: "frg__root__raw_1__item1__prod1__codi1"
    eob:
      raw:              "frg__root__raw_1"
      patient:          "frg__root__raw_1__pati1"
      insurer:          "frg__root__raw_1__insu1"
      total:            "frg__root__raw_1__tota1"
      total_amount:     "frg__root__raw_1__tota1__amou1"
      payment:          "frg__root__raw_1__paym1"
      payment_amount:   "frg__root__raw_1__paym1__amou1"

models:
  avalon_omop:
    +materialized: table
    +schema: omop
    staging:
      +materialized: view
